<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#09090b">
  <title>Kick TV</title>
  <style>
    *{box-sizing:border-box}html,body,main{margin:0;width:100%;height:100%;overflow:hidden;background:#09090b;color:#fff;font:22px Arial,sans-serif}
    .home{height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 38%,#173116 0,#101311 34%,#09090b 75%)}
    .content{width:min(900px,85vw);display:flex;flex-direction:column;align-items:center;text-align:center}.brand{display:flex;align-items:center;justify-content:center;gap:16px;color:#53fc18;font-size:34px;font-weight:800;letter-spacing:2px}.brand-mark{display:grid;place-items:center;width:58px;height:58px;border-radius:12px;background:#53fc18;color:#09090b;font-size:38px;font-weight:900}
    h1{font-size:48px;line-height:1.1;margin:42px 0 12px}.subtitle{font-size:23px;color:#bbb;margin:0 0 34px}#channel-form{width:min(760px,100%)}label{display:block;color:#bbb;font-size:18px;margin-bottom:10px}.input-row{display:flex;align-items:stretch;width:100%;height:66px;margin-inline:auto}.prefix{display:flex;align-items:center;padding:0 16px;background:#202020;color:#aaa;border:1px solid #444;border-right:0;border-radius:8px 0 0 8px;font-size:20px}input{min-width:0;flex:1;padding:0 14px;background:#151515;color:white;border:1px solid #444;font-size:24px}button{display:flex;align-items:center;justify-content:center;align-self:stretch;height:100%;min-height:66px;flex:0 0 auto;padding:0 24px;background:#53fc18;color:#09090b;border:0;border-radius:0 8px 8px 0;font-size:21px;line-height:1;font-weight:700}input:focus,button:focus{outline:4px solid white;outline-offset:3px}button:focus{background:#72ff3f}.message{min-height:30px;color:#b7fa6a;font-size:17px;margin-top:15px;text-align:center}.message.error{color:#ff8787}footer{position:absolute;left:7.5vw;right:7.5vw;bottom:38px;display:flex;justify-content:space-between;color:#999;font-size:15px;letter-spacing:.5px}
    #watch-view{position:absolute;inset:0;background:#000}#video{width:100%;height:100%;object-fit:contain;background:#000} .hidden{display:none!important}
  </style>
</head>
<body>
  <main>
    <section id="welcome" class="home" aria-labelledby="title">
      <div class="content">
        <div class="brand"><span class="brand-mark">K</span><span>KICK TV</span></div>
        <h1 id="title">Assista à Kick na sua TV.</h1>
        <form id="channel-form">
          <div class="input-row"><span class="prefix">kick.com/</span><input id="channel" name="channel" value="" maxlength="30" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Nome do canal da Kick" autofocus tabindex="0"></div>
        </form>
        <div id="message" class="message" role="status" aria-live="polite"></div>
      </div>
    </section>
    <section id="watch-view" class="hidden" aria-label="Transmissão">
      <video id="video" autoplay playsinline preload="auto"></video>
    </section>
  </main>
  <script>
  (function(){
    'use strict';
    var form=document.getElementById('channel-form'),input=document.getElementById('channel'),message=document.getElementById('message');
    var welcome=document.getElementById('welcome'),watchView=document.getElementById('watch-view'),video=document.getElementById('video'),requestId=0,channel='';
    function setMessage(text,error){message.textContent=text;message.className=error?'message error':'message';}
    function showHome(text,error){requestId++;video.pause();video.removeAttribute('src');video.load();watchView.classList.add('hidden');welcome.classList.remove('hidden');setMessage(text||'Digite o canal e pressione OK/Enter para assistir.',!!error);input.value=channel;input.focus();}
    function startPlayback(raw){
      var normalized=raw.trim().replace(/^@/,'').toLowerCase();
      if(!/^[a-z0-9_]{1,30}$/.test(normalized)){setMessage('Digite um nome de canal válido.',true);input.focus();return;}
      channel=normalized;input.value=channel;try{localStorage.setItem('kick-tv.last-channel',channel);}catch(ignore){}
      var thisRequest=++requestId;setMessage('Conectando à transmissão…',false);
      fetch('https://kick.com/api/v2/channels/'+encodeURIComponent(channel)+'/livestream',{method:'GET',cache:'no-store',credentials:'omit'})
        .then(function(r){if(!r.ok)throw new Error('A Kick respondeu HTTP '+r.status+'.');return r.json();})
        .then(function(json){
          if(thisRequest!==requestId)return;
          var data=json&&json.data;if(!data||!data.playback_url)throw new Error('Canal offline ou sem transmissão disponível.');
          var u=new URL(data.playback_url);if(u.protocol!=='https:'||!u.pathname.toLowerCase().endsWith('.m3u8'))throw new Error('A Kick retornou um fluxo incompatível.');
          welcome.classList.add('hidden');watchView.classList.remove('hidden');
          video.muted=false;video.defaultMuted=false;video.src=u.href;video.load();
          var playPromise=video.play();if(playPromise&&playPromise.catch)playPromise.catch(function(){/* No overlay: remote Play can retry. */});
        }).catch(function(e){if(thisRequest===requestId)showHome(e.message,true);});
    }
    form.addEventListener('submit',function(e){e.preventDefault();startPlayback(input.value);});
    video.addEventListener('error',function(){if(video.error&&video.error.code===4)showHome('Esta TV não conseguiu reproduzir o formato retornado.',true);});
    document.addEventListener('keydown',function(e){
      var key=e.key,code=e.keyCode;
      if(watchView.classList.contains('hidden')){
        if(document.activeElement===input&&(key==='Enter'||code===13)){
          e.preventDefault();startPlayback(input.value);return;
        }
      }
      if(key==='Escape'||key==='Backspace'||key==='BrowserBack'||code===10009||code===461){if(!watchView.classList.contains('hidden')){e.preventDefault();showHome('Selecione outro canal ou tente novamente.',false);}return;}
      if(!watchView.classList.contains('hidden')&&(key==='MediaPlay'||key==='Enter'||code===415)){e.preventDefault();video.muted=false;var p=video.play();if(p&&p.catch)p.catch(function(){});}
    });
    try{var last=localStorage.getItem('kick-tv.last-channel');if(last&&/^[a-zA-Z0-9_]{1,30}$/.test(last))channel=last;}catch(ignore){}
    input.value=channel;input.focus();
  }());
  </script>
</body>
</html>
